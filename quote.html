<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הצעת מחיר | IRON BEN</title><meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
.q{max-width:860px;margin:0 auto;padding-block:40px 64px}
.q header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px}
.q header img{width:52px}
.q h1{font-size:56px}
.q .meta{font-size:14px;color:var(--muted);text-align:start}
.q table{width:100%;border-collapse:collapse;margin-top:24px;font-size:16px}
.q th,.q td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.q th{font-size:14px;color:var(--muted);font-weight:600}
.q td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.q tfoot td{border-bottom:0}.q tfoot tr:last-child td{font-weight:900;font-size:28px;border-top:1px solid var(--ink);padding-top:14px}
.tw{overflow-x:auto}
.render{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.render .model{min-height:280px}
.terms{margin:28px 0 0;padding:0 18px 0 0;font-size:15px;color:var(--muted)}
.terms li{margin-bottom:6px}
.accept{margin-top:28px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.accept .field{flex:1;min-width:200px}
.status{font-size:15px}.status.ok{color:var(--ok)}.status.err{color:var(--err)}
@media (max-width:700px){.render{grid-template-columns:1fr}.q h1{font-size:52px}}
@media print{.accept,.noprint,.model-tabs{display:none!important}body{background:#fff;color:#000}.q th,.q td{border-color:#ccc}.q .meta,.terms{color:#444}}
</style></head>
<body><main class="wrap"><div class="q" id="q"><p id="msg" role="status">טוען את ההצעה...</p></div></main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script type="module">
const C = window.IRONBEN_CONFIG || {}, box = document.getElementById("q"), t = new URLSearchParams(location.search).get("t");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ils = (n) => Math.round(Number(n) || 0).toLocaleString("he-IL") + " ₪";
const heDate = (d) => new Date(d).toLocaleDateString("he-IL", { timeZone: "Asia/Jerusalem" });
if (!t || !C.SUPABASE_URL) { box.innerHTML = "<p>הקישור להצעה לא תקין.</p>"; }
else {
  const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, { db: { schema: C.SCHEMA || "ironben" } });
  const r = await sb.rpc("get_quote", { p_token: t });
  const q = r.data;
  if (r.error || !q) { box.innerHTML = "<p>ההצעה לא נמצאה. אפשר לפנות אלינו ונשלח שוב.</p>"; }
  else {
    const b = q.business || {}, vat = q.total - q.subtotal;
    const rows = (q.items || []).map((i) => `<tr><td>${esc(i.name)}${i.note ? "<br><small>" + esc(i.note) + "</small>" : ""}</td><td class="n">${esc(i.qty)} ${esc(i.unit)}</td><td class="n">${ils(i.unit_price)}</td><td class="n">${ils(i.line_total)}</td></tr>`).join("");
    const valid = q.valid_until ? heDate(q.valid_until) : "";
    const accepted = q.status === "accepted";
    const withModel = (q.items || []).find((i) => i.sketch_params && i.sketch_params.model);
    box.innerHTML = `<header><div><img src="brand/logo-120.png" alt="IRON BEN"><h1>הצעת מחיר</h1><div>${esc(q.title || "")}</div></div><div class="meta">${esc(b.name)}<br>${esc(b.address)}${b.phone ? "<br>" + esc(b.phone) : ""}${b.id ? "<br>ע.מ " + esc(b.id) : ""}<br>מספר ${esc(q.number)} · ${heDate(q.created_at)}</div></header>
      <p style="margin-top:20px">לכבוד ${esc(q.customer_name)}</p>
      ${withModel ? `<div class="render"><div><div class="model-tabs" role="tablist"><button type="button" class="on" data-mode="3d">הדמיה</button><button type="button" data-mode="plan">תוכנית</button></div><div class="model" id="m3d"></div></div><div style="display:grid;align-content:center;color:var(--muted);font-size:15px">הדמיה לפי המידות שנמדדו. הגימור, העץ והפרטים הסופיים לפי שרטוט הייצור שיאושר.</div></div>` : ""}
      <div class="tw"><table><thead><tr><th>פריט</th><th>כמות</th><th>מחיר ליחידה</th><th>סה"כ</th></tr></thead><tbody>${rows}</tbody>
      <tfoot><tr><td colspan="3">סה"כ לפני מע"מ</td><td class="n">${ils(q.subtotal)}</td></tr><tr><td colspan="3">מע"מ ${esc(q.vat_pct)}%</td><td class="n">${ils(vat)}</td></tr><tr><td colspan="3">סה"כ לתשלום</td><td class="n">${ils(q.total)}</td></tr></tfoot></table></div>
      ${q.notes ? "<p style='margin-top:16px'>" + esc(q.notes) + "</p>" : ""}
      <ul class="terms">${valid ? "<li>ההצעה בתוקף עד " + valid + ".</li>" : ""}
      ${q.deposit_pct ? "<li>מקדמה של " + esc(q.deposit_pct) + "% באישור ההזמנה, לכיסוי חומרים. היתרה לפי שלבים.</li>" : ""}
      <li>המחיר מבוסס על מחיר הברזל ביום ההצעה. אם מחיר הברזל משתנה ביותר מ-${esc(q.reprice_threshold_pct)}% עד ההזמנה, רכיב הברזל יעודכן.</li>
      <li>המחיר הסופי לפי מידות שאושרו במדידה. שינויים אחרי אישור השרטוט מתומחרים בנפרד.</li>
      <li>מוצר שמיוצר לפי מידות הלקוח אינו ניתן לביטול אחרי תחילת הייצור.</li></ul>
      ${accepted ? `<div class="accept"><b>ההצעה אושרה על ידי ${esc(q.accepted_name)} ב-${heDate(q.accepted_at)}.</b></div>`
        : q.status === "expired" ? `<div class="accept">תוקף ההצעה פג. פנו אלינו לעדכון.</div>`
        : `<form class="accept" id="acc"><div class="field"><label for="an">שם מלא לאישור</label><input id="an" required autocomplete="name"></div><button class="btn primary" type="submit">אני מאשר/ת את ההצעה</button><span class="status" id="as" role="status"></span></form>`}
      <p class="noprint" style="margin-top:20px"><button class="btn small" type="button" onclick="window.print()">שמירה כ-PDF / הדפסה</button></p>`;
    const f = document.getElementById("acc");
    if (f) f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const n = document.getElementById("an").value.trim(), s = document.getElementById("as");
      if (!n) { s.textContent = "כתבו שם מלא."; return; }
      const x = await sb.rpc("accept_quote", { p_token: t, p_name: n });
      if (x.data) { s.textContent = "תודה! ההצעה אושרה. ניצור קשר לתיאום."; s.className = "status ok"; f.querySelector("button").disabled = true; }
      else { s.textContent = "לא הצלחנו לאשר. ייתכן שתוקף ההצעה פג."; s.className = "status err"; }
    });
    if (withModel) {
      try {
        const M = await import("./model3d.js");
        const m = await M.mount(document.getElementById("m3d"), {});
        const p = withModel.sketch_params;
        m.update(p.model, p, { finish: p.finish, wood: p.wood });
        document.querySelectorAll(".model-tabs button").forEach((bt) => bt.addEventListener("click", () => { document.querySelectorAll(".model-tabs button").forEach((x) => x.classList.toggle("on", x === bt)); m.setMode(bt.dataset.mode); }));
      } catch (e) { document.querySelector(".render")?.remove(); }
    }
  }
}
</script></body></html>
