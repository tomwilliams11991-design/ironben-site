<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>בחירת שער וסדנה | IRON BEN</title>
<link rel="stylesheet" href="../fonts.css">
<style>
body{margin:0;background:#141210;color:#efe9df;font-family:Rubik,system-ui,sans-serif;font-weight:300;padding:32px 24px 64px}
h1{font-weight:900;font-size:40px;margin:0 0 8px}
h2{font-weight:500;font-size:22px;margin:40px 0 12px}
p{color:#b3aa9b;max-width:60ch;margin:0 0 20px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
figure{margin:0;position:relative;border-radius:6px;overflow:hidden;background:#000;aspect-ratio:16/9}
figure img{width:100%;height:100%;object-fit:cover;display:block}
figure .mark{position:absolute;left:50%;top:50%;width:14%;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
figcaption{position:absolute;inset:auto 0 0 0;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:18px;font-weight:500}
figcaption small{display:block;font-weight:300;color:#cfc6b8;font-size:14px}
</style></head><body>
<h1>שער וסדנה</h1>
<p>שלוש אפשרויות לשער (הלוגו מונח על המדליון, כך הוא ייראה בכניסה) ושלוש לסדנה. בחר מספר אחד מכל קבוצה.</p>
<h2>השער</h2>
<div class="grid">
<figure><img src="../img/src/scene/gate-1.png" alt=""><img class="mark" src="logo.png" alt=""><figcaption>שער 1<small>אלון כהה, עלי אלון מגולפים, מסגרת פלדה מודרנית, רואים את הסדנה בצדדים</small></figcaption></figure>
<figure><img src="../img/src/scene/gate-2.png" alt=""><img class="mark" src="logo.png" alt=""><figcaption>שער 2<small>אלון דבש, שיבולים מגולפות, סורגי ברזל מרוקעים</small></figcaption></figure>
<figure><img src="../img/src/scene/gate-3.png" alt=""><img class="mark" src="logo.png" alt=""><figcaption>שער 3<small>אגוז, שמש גיאומטרית מפלדה ופליז, הכי מודרני</small></figcaption></figure>
</div>
<h2>הסדנה</h2>
<div class="grid">
<figure><img src="../img/src/scene/shop-4.png" alt=""><figcaption>סדנה 4<small>אבן וקורות, כבשן, סדן על גזע, מדפי אלון ושולחן פלדה, אור יום ואש</small></figcaption></figure>
<figure><img src="../img/src/scene/shop-5.png" alt=""><figcaption>סדנה 5<small>אבן מסוידת, חלון גדול לנוף, הכי בהיר ונקי</small></figcaption></figure>
<figure><img src="../img/src/scene/shop-6.png" alt=""><figcaption>סדנה 6<small>כהה ודרמטי, שולחן שרטוט עם תוכנית, הכי "בוטיק"</small></figcaption></figure>
</div>
<h2>הדלת לקיר הדלתות (אחת לכולן)</h2>
<div class="grid"><figure style="aspect-ratio:2/3;max-width:360px"><img src="../img/src/scene/door.png" alt=""><figcaption>דלת העבודות<small>מקבלת פלטת ברזל עם שם הקטגוריה</small></figcaption></figure></div>
</body></html>
